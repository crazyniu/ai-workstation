services:
  gateway:
    image: ${GATEWAY_IMAGE:-gateway-local:1.0.0}
    build:
      context: .
      args:
        BASE_IMAGE: ${GATEWAY_BASE_IMAGE:-debian:trixie-slim}
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    sysctls:
      net.ipv4.ip_forward: '1'
      net.ipv4.conf.all.rp_filter: '0'
    environment:
      GATEWAY_MODE: 'true'
      GATEWAY_ADMIN_PASSWORD: ${GATEWAY_ADMIN_PASSWORD:-root}
      GATEWAY_CONTAINER_USER: ${GATEWAY_CONTAINER_USER:-root}
      GATEWAY_CONTAINER_PASSWORD: ${GATEWAY_CONTAINER_PASSWORD:-root}
      GATEWAY_LAN_ADDRESS: ${GATEWAY_LAN_ADDRESS:?Set the gateway LAN address with CIDR}
      GATEWAY_LAN_ROUTER: ${GATEWAY_LAN_ROUTER:?Set the upstream LAN router}
      GATEWAY_HOST_ADDRESS: ${GATEWAY_HOST_ADDRESS:-}
      GATEWAY_BRIDGE_ROUTER: ${GATEWAY_BRIDGE_ROUTER:-172.30.100.1}
    networks:
      control:
        ipv4_address: ${GATEWAY_CONTROL_ADDRESS:-172.30.100.2}
      uplink: {}
networks:
  control:
    driver: bridge
    ipam:
      config:
        - subnet: ${GATEWAY_CONTROL_SUBNET:-172.30.100.0/24}
          gateway: ${GATEWAY_BRIDGE_ROUTER:-172.30.100.1}
  uplink:
    driver: macvlan
    driver_opts:
      parent: ${GATEWAY_PARENT_INTERFACE:?Set the host physical LAN interface}
    # Docker assigns no address; the entrypoint configures the LAN IPv4.
    enable_ipv4: false
