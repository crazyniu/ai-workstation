worker_processes auto;
pid /run/nginx.pid;
events { worker_connections 1024; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 sendfile on;
 server_tokens off;
 access_log off;
 error_log /dev/stderr warn;
 map $http_upgrade $connection_upgrade { default upgrade; '' close; }
 geo $transfer_only_workstation {
  default 0;
  # Paired LAN workstation address is supplied at startup.
 }
 map $uri $deny_workstation_web {
  volatile;
  default $transfer_only_workstation;
  ~^/transfer(?:/|$) 0;
  ~^/api/transfer/(?:list|file|folder|all|mcp)$ 0;
  /style.css 0;
  /toast.js 0;
  /favicon.svg 0;
  /icons/folder.svg 0;
  /icons/files.svg 0;
  /icons/apps/transfer.webp 0;
 }
 server {
  listen 80 default_server;
  server_name _;
  root /opt/gateway/current/web;
  index index.html;
  charset utf-8;
  client_max_body_size 36m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  if ($deny_workstation_web) { return 403; }
  location = /healthz { return 200 'ok\n'; }
  location /api/ {
   proxy_pass http://127.0.0.1:8787;
   proxy_set_header Host $http_host;
   proxy_read_timeout 210s;
   proxy_set_header X-Real-IP $remote_addr;
  }
  location = /_auth {
   internal;
   proxy_pass http://127.0.0.1:8787/api/auth/check;
   proxy_pass_request_body off;
   proxy_set_header Content-Length '';
   proxy_set_header Host $http_host;
  }
  # Configuration changes go through the gateway compiler. Node selection remains writable.
  location ~ ^/clash-api/configs/?$ {
   limit_except GET { deny all; }
   auth_request /_auth;
   rewrite ^ /configs break;
   proxy_pass http://127.0.0.1:9090;
   include /run/gateway/proxy-auth.conf;
  }
  location /clash-api/ {
   auth_request /_auth;
   proxy_pass http://127.0.0.1:9090/;
   include /run/gateway/proxy-auth.conf;
   proxy_set_header Upgrade $http_upgrade;
   proxy_set_header Connection $connection_upgrade;
   proxy_http_version 1.1;
   proxy_read_timeout 1h;
  }
  location = /ui/config.js {
   auth_request /_auth;
   default_type application/javascript;
   alias /opt/gateway/runtime/panel-config.js;
  }
  location /ui/ {
   auth_request /_auth;
   proxy_pass http://127.0.0.1:9090/ui/;
   include /run/gateway/proxy-auth.conf;
   # Panels open in desktop windows; the server keeps X-Frame-Options SAMEORIGIN.
   proxy_hide_header X-Frame-Options;
  }
  # The gateway terminal (ttyd). It needs a password session and a same-origin WebSocket.
  location /terminal/ {
   auth_request /_terminal_auth;
   proxy_pass http://unix:/run/gateway/terminal.sock;
   proxy_http_version 1.1;
   proxy_set_header Host $http_host;
   proxy_set_header Upgrade $http_upgrade;
   proxy_set_header Connection $connection_upgrade;
   proxy_buffering off;
   proxy_read_timeout 1d;
   proxy_send_timeout 1d;
  }
  location = /_terminal_auth {
   internal;
   proxy_pass http://127.0.0.1:8787/api/auth/terminal;
   proxy_pass_request_body off;
   proxy_set_header Content-Length '';
   proxy_set_header Host $http_host;
  }
  location /adguard/ {
   auth_request /_auth;
   proxy_pass http://127.0.0.1:3000/;
   proxy_set_header Host $http_host;
   proxy_set_header X-Forwarded-Prefix /adguard;
   proxy_redirect / /adguard/;
   proxy_hide_header X-Frame-Options;
  }
  location / { try_files $uri $uri/ /index.html; }
 }
}
