worker_processes auto;
pid /run/nginx.pid;
events { worker_connections 1024; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 sendfile on;
 server_tokens off;
 access_log off;
 error_log /dev/stderr warn;
 map $http_upgrade $connection_upgrade { default upgrade; '' close; }
 server {
  listen 80 default_server;
  server_name _;
  root /opt/gateway/web;
  index index.html;
  charset utf-8;
  client_max_body_size 36m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  location = /healthz { return 200 'ok\n'; }
  location /api/ {
   proxy_pass http://127.0.0.1:8787;
   proxy_set_header Host $http_host;
   proxy_read_timeout 210s;
   proxy_set_header X-Real-IP $remote_addr;
  }
  location = /_auth {
   internal;
   proxy_pass http://127.0.0.1:8787/api/auth/check;
   proxy_pass_request_body off;
   proxy_set_header Content-Length '';
   proxy_set_header Host $http_host;
  }
  location /clash-api/ {
   auth_request /_auth;
   proxy_pass http://127.0.0.1:9090/;
   include /run/gateway/proxy-auth.conf;
   proxy_set_header Upgrade $http_upgrade;
   proxy_set_header Connection $connection_upgrade;
   proxy_http_version 1.1;
   proxy_read_timeout 1h;
  }
  location = /ui/config.js {
   auth_request /_auth;
   default_type application/javascript;
   alias /opt/gateway/runtime/panel-config.js;
  }
  location /ui/ {
   auth_request /_auth;
   proxy_pass http://127.0.0.1:9090/ui/;
   include /run/gateway/proxy-auth.conf;
  }
  location /adguard/ {
   auth_request /_auth;
   proxy_pass http://127.0.0.1:3000/;
   proxy_set_header Host $http_host;
   proxy_set_header X-Forwarded-Prefix /adguard;
   proxy_redirect / /adguard/;
  }
  location / { try_files $uri $uri/ /index.html; }
 }
}
