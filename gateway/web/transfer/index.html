<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>局域网互传 · Gateway</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="alternate" type="text/plain" title="AI 提示词" href="./ai.txt">
  <link rel="stylesheet" href="/style.css?v=bb1ef4d1eee8">
  <link rel="stylesheet" href="/transfer/transfer.css?v=4d0b34e4a12f">
  <script src="/toast.js?v=213fd4fb47a6" defer></script>
  <script src="/transfer/transfer.js?v=40d9af1144d7" defer></script>
</head>
<body>
  <main class="transfer">
    <header class="heading">
      <div class="title"><img src="/icons/apps/transfer.webp" onerror="this.onerror=null;this.src='/icons/files.svg'" alt="" width="36" height="36"><h1>局域网互传</h1></div>
      <div class="heading-actions">
        <button id="open-document">共享文档</button>
        <button id="copy">复制 AI 提示词</button>
      </div>
    </header>
    <section class="library" aria-label="共享文件">
      <div class="toolbar">
        <button id="upload" class="primary">上传文件</button>
        <input id="files" type="file" multiple hidden>
        <button id="new-folder">新建文件夹</button>
        <button id="refresh" class="text-action">刷新</button>
        <button id="clear" class="text-action destructive">清空全部</button>
      </div>
      <div class="location">
        <nav id="crumbs" aria-label="当前文件夹"></nav>
        <span id="count"></span>
      </div>
      <p id="status" role="status"></p>
      <div class="columns" id="columns" aria-hidden="true" hidden><span>名称</span><span>大小</span><span>操作</span></div>
      <ul id="entries" aria-label="文件列表"></ul>
      <p id="empty" hidden>文件夹为空</p>
    </section>
  </main>
  <dialog id="folder-dialog" aria-labelledby="folder-title">
    <form id="folder-form">
      <h2 id="folder-title">新建文件夹</h2>
      <label>文件夹名称<input id="folder-name" required autofocus></label>
      <div class="dialog-actions"><button type="button" id="cancel-folder">取消</button><button class="primary">创建</button></div>
    </form>
  </dialog>
  <dialog id="shared-document" aria-labelledby="document-title">
    <form id="document-form">
      <div class="document-heading">
        <h2 id="document-title">共享文档</h2>
        <button type="button" id="close-document">关闭</button>
      </div>
      <textarea id="document-text" aria-label="共享文档正文" autofocus></textarea>
      <div class="dialog-actions">
        <button type="button" id="reload-document">刷新</button>
        <button type="button" id="copy-document">复制正文</button>
        <button class="primary" id="save-document">保存</button>
      </div>
    </form>
  </dialog>
  <dialog id="manual" aria-labelledby="manual-title">
    <form method="dialog">
      <h2 id="manual-title">AI 提示词</h2>
      <textarea id="prompt" aria-label="AI 提示词" readonly></textarea>
      <div class="dialog-actions"><button>关闭</button></div>
    </form>
  </dialog>
</body>
</html>
