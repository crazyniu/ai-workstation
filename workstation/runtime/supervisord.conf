[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/supervisord.pid
[program:sshd]
command=/usr/sbin/sshd -D -e
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
[program:vnc]
command=/usr/sbin/runuser -u dev -- /usr/local/bin/workstation-vnc
priority=20
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
[program:desktop]
command=/usr/sbin/runuser -u dev -- /usr/local/bin/workstation-desktop
priority=30
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
[program:desktop-guard]
command=/usr/sbin/runuser -u dev -- /usr/bin/setpriv --no-new-privs /usr/bin/python3 -u /etc/workstation/desktop-guard.py
priority=40
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
