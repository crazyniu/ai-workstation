services:
  workstation:
    image: ${WORKSTATION_IMAGE:-ghcr.io/crazyniu/ai-workstation:latest}
    hostname: ai-workstation
    restart: unless-stopped
    shm_size: 512mb
    # Routing belongs to Docker/the gateway; apps cannot alter it or send raw frames.
    cap_drop: [NET_ADMIN, NET_RAW]
    security_opt:
      - no-new-privileges:true
      - seccomp=./security/seccomp-chrome.json
    ports:
      - "127.0.0.1:${SSH_PORT:-2222}:22"
      - "127.0.0.1:${VNC_PORT:-5901}:5901"
      - "127.0.0.1:${NOVNC_PORT:-6080}:6080"
    environment:
      DEV_PASSWORD: ${WORKSTATION_PASSWORD:-root}
      VNC_PASSWORD: ${VNC_PASSWORD:-root}
      VNC_AUTH: ${VNC_AUTH:-password}
      NOVNC_TLS: ${NOVNC_TLS:-1}
      NOVNC_ALLOWED_ORIGINS: ${NOVNC_ALLOWED_ORIGINS:-}
      ROOT_PASSWORD: ${WORKSTATION_ROOT_PASSWORD:-root}
      # Country + language select the glibc UTF-8 locale (default: en_SG.UTF-8).
      WORKSTATION_COUNTRY: ${WORKSTATION_COUNTRY:-SG}
      WORKSTATION_LANGUAGE: ${WORKSTATION_LANGUAGE:-en}
      WORKSTATION_TIMEZONE: ${WORKSTATION_TIMEZONE:-Asia/Singapore}
      # Bridge mode can reach a gateway on another host/network via an explicit
      # private proxy endpoint. Empty values use the host's ordinary egress.
      HTTP_PROXY: ${WORKSTATION_HTTP_PROXY:-}
      HTTPS_PROXY: ${WORKSTATION_HTTPS_PROXY:-}
      NO_PROXY: ${WORKSTATION_NO_PROXY:-localhost,127.0.0.1}
