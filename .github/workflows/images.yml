name: Container images
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'README.md'
      - 'AI-INSTALL.md'
      - 'AGENTS.md'
      - 'gateway/README.md'
      - 'workstation/README.md'
      - 'workstation/VALIDATION.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'CODE_OF_CONDUCT.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  # Every PR reports Required checks, including documentation-only changes.
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      images: ${{ steps.scope.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify change classification
        run: python3 -m unittest discover -s tests -p 'test_ci_changes.py' -v
      - name: Determine build scope
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci-changes.py
  images:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: gateway
            image: ai-workstation-gateway
          - component: workstation
            image: ai-workstation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@v3
      - name: Prepare gateway components and tests
        if: matrix.component == 'gateway'
        run: |
          python3 -m pip install PyYAML
          python3 gateway/scripts/fetch-components.py amd64
          python3 -m unittest discover -s gateway/tests -v
          python3 -m unittest discover -s tests -p 'test_deploy.py' -v
          node --check gateway/web/app.js
          node --check gateway/web/build-info.js
      - name: Build candidate
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          platforms: linux/amd64
          load: true
          tags: candidate:${{ matrix.component }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Verify gateway clean deployment
        if: matrix.component == 'gateway'
        run: |
          sudo mkdir -p /dev/net
          if [ ! -c /dev/net/tun ]; then sudo mknod /dev/net/tun c 10 200; fi
          bash gateway/tests/clean-smoke.sh candidate:gateway
      - name: Verify workstation clean deployment
        if: matrix.component == 'workstation'
        run: |
          set -e
          for test in workstation/tests/test-*.py; do python3 "$test"; done
          bash workstation/tests/smoke.sh candidate:workstation
      - name: Verify workstation internal storage
        if: matrix.component == 'workstation'
        run: bash workstation/tests/internal-storage.sh candidate:workstation
      - name: Audit all image layers
        run: docker image save candidate:${{ matrix.component }} | python3 ${{ matrix.component }}/tests/audit-image.py
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified candidate
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          COMMIT: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          docker tag candidate:${{ matrix.component }} "$IMAGE:sha-$COMMIT"
          docker push "$IMAGE:sha-$COMMIT"
          if [ "$REF_TYPE" = tag ]; then
            docker tag candidate:${{ matrix.component }} "$IMAGE:$REF_NAME"
            docker push "$IMAGE:$REF_NAME"
          else
            docker tag candidate:${{ matrix.component }} "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
  required-checks:
    name: Required checks
    if: always()
    needs: [changes, images]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful applicable checks
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          BUILD_IMAGES: ${{ needs.changes.outputs.images }}
          IMAGES_RESULT: ${{ needs.images.result }}
        run: |
          case "$SCOPE_RESULT/$BUILD_IMAGES/$IMAGES_RESULT" in
            success/true/success|success/false/skipped)
              echo 'All applicable checks passed.'
              ;;
            *)
              echo "Required checks failed: scope=$SCOPE_RESULT images=$IMAGES_RESULT" >&2
              exit 1
              ;;
          esac
