name: Container images
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'README.md'
      - 'AI-INSTALL.md'
      - 'AGENTS.md'
      - 'gateway/README.md'
      - 'workstation/README.md'
      - 'workstation/VALIDATION.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'CODE_OF_CONDUCT.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  # Every PR reports Required checks, including documentation-only changes.
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      images: ${{ steps.scope.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify change classification
        run: python3 -m unittest discover -s tests -p 'test_ci_changes.py' -v
      - name: Determine build scope
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci-changes.py
  images:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {component: gateway, image: ai-workstation-gateway, arch: amd64, platform: linux/amd64, runner: ubuntu-latest}
          - {component: gateway, image: ai-workstation-gateway, arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm}
          - {component: gateway, image: ai-workstation-gateway, arch: '386', platform: linux/386, runner: ubuntu-latest}
          - {component: gateway, image: ai-workstation-gateway, arch: armv5, platform: linux/arm/v5, runner: ubuntu-latest}
          - {component: gateway, image: ai-workstation-gateway, arch: armv7, platform: linux/arm/v7, runner: ubuntu-latest}
          - {component: gateway, image: ai-workstation-gateway, arch: riscv64, platform: linux/riscv64, runner: ubuntu-latest}
          - {component: workstation, image: ai-workstation, arch: amd64, platform: linux/amd64, runner: ubuntu-latest}
          - {component: workstation, image: ai-workstation, arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: all
      - uses: docker/setup-buildx-action@v3
      - name: Prepare gateway components and tests
        if: matrix.component == 'gateway'
        run: |
          python3 -m pip install PyYAML
          python3 gateway/scripts/fetch-components.py ${{ matrix.arch }}
          python3 -m unittest discover -s gateway/tests -v
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          node --check gateway/web/app.js
          node --check gateway/web/build-info.js
      - name: Build candidate
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          platforms: ${{ matrix.platform }}
          load: true
          tags: candidate:${{ matrix.component }}
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.arch }}
      - name: Verify gateway clean deployment
        if: matrix.component == 'gateway'
        run: |
          bash gateway/tests/clean-smoke.sh candidate:gateway
      - name: Verify workstation clean deployment
        if: matrix.component == 'workstation'
        run: |
          set -e
          for test in workstation/tests/test-*.py; do python3 "$test"; done
          bash workstation/tests/smoke.sh candidate:workstation
      - name: Verify workstation internal storage
        if: matrix.component == 'workstation'
        run: |
          bash workstation/tests/internal-storage.sh candidate:workstation
          bash workstation/tests/web-desktop.sh candidate:workstation
      - name: Audit all image layers
        run: docker image save candidate:${{ matrix.component }} | python3 ${{ matrix.component }}/tests/audit-image.py
      - name: Verify native Linux installation from clean source
        if: matrix.component == 'workstation'
        run: |
          docker build -f tests/Dockerfile.native -t native-candidate:test .
          bash tests/native-smoke.sh native-candidate:test
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified candidate
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          COMMIT: ${{ github.sha }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker tag candidate:${{ matrix.component }} "$IMAGE:sha-$COMMIT-$ARCH"
          docker push "$IMAGE:sha-$COMMIT-$ARCH"
  windows:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify PowerShell deployment guard
        shell: pwsh
        run: ./tests/test-deploy.ps1
  publish:
    needs: [images, windows]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish manifests after all architectures and native checks pass
        env:
          OWNER: ${{ github.repository_owner }}
          COMMIT: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          for component in ai-workstation-gateway ai-workstation; do
            image="ghcr.io/$OWNER/$component"
            arches='amd64 arm64'
            if [ "$component" = ai-workstation-gateway ]; then arches='amd64 arm64 386 armv5 armv7 riscv64'; fi
            sources=()
            for arch in $arches; do sources+=("$image:sha-$COMMIT-$arch"); done
            tags=(-t "$image:sha-$COMMIT")
            if [ "$REF_TYPE" = tag ]; then tags+=(-t "$image:$REF_NAME"); else tags+=(-t "$image:latest"); fi
            docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          done
  required-checks:
    name: Required checks
    if: always()
    needs: [changes, images, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful applicable checks
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          BUILD_IMAGES: ${{ needs.changes.outputs.images }}
          IMAGES_RESULT: ${{ needs.images.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          case "$SCOPE_RESULT/$BUILD_IMAGES/$IMAGES_RESULT/$WINDOWS_RESULT" in
            success/true/success/success|success/false/skipped/skipped)
              echo 'All applicable checks passed.'
              ;;
            *)
              echo "Required checks failed: scope=$SCOPE_RESULT images=$IMAGES_RESULT" >&2
              exit 1
              ;;
          esac
