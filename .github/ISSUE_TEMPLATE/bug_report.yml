name: 问题报告 / Bug report
description: 部署、网关或工作站的功能不符合预期 / Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        提交前请删除密码、订阅地址、代理认证、令牌、私钥和个人 IP。
        Remove passwords, subscription URLs, proxy credentials, tokens, private keys and personal IP addresses before submitting.
  - type: dropdown
    id: role
    attributes:
      label: 角色 / Role
      options: [网关 / Gateway, 工作站 / Workstation, 两者 / Both, 部署脚本 / Deployment scripts]
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: 部署方式 / Deployment
      options:
        - portable（compose.portable.yaml）
        - 同机 LAN / One LAN host（compose.yaml）
        - 分机 LAN / Separate LAN hosts（compose.gateway.yaml / compose.workstation.yaml）
        - bridge 工作站 / Bridge workstation（workstation/compose.yaml）
        - Linux 原生 / Linux native（install-native.py）
    validations:
      required: true
  - type: input
    id: image
    attributes:
      label: 镜像标签或 SHA / Image tag or SHA
      placeholder: ghcr.io/crazyniu/ai-workstation-gateway:sha-…
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: 宿主机与 CPU 架构 / Host OS and CPU architecture
      placeholder: Ubuntu 24.04 amd64, Synology DSM 7.2 arm64, Docker Desktop on macOS…
  - type: textarea
    id: what
    attributes:
      label: 发生了什么 / What happened
      description: 实际结果与预期结果 / Actual and expected behaviour
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图 / Logs or screenshots
      description: 只贴相关片段，并已脱敏 / Only the relevant, redacted lines
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: 确认 / Confirmation
      options:
        - label: 我已删除凭据、订阅地址和其他私人信息 / I removed credentials, subscription URLs and other private data
          required: true
