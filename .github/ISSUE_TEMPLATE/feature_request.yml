name: 功能建议 / Feature request
description: 提出新功能或改进 / Suggest a new feature or an improvement
labels: [enhancement]
body:
  - type: dropdown
    id: role
    attributes:
      label: 角色 / Role
      options: [网关 / Gateway, 工作站 / Workstation, 两者 / Both, 部署与文档 / Deployment and docs]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 现在哪里不方便，在什么场景下遇到 / What is hard today, and when
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法 / Proposal
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案 / Alternatives considered
